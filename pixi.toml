[workspace]
channels = ["conda-forge"]
name = "opls-profile-collection"
platforms = ["linux-64"]
version = "2026.2.0"


[activation.env]
REDIS_HOST="xf12id1-opls-redis1.nsls2.bnl.gov"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
bluesky-base = "==1.15.1"
bluesky-queueserver = "*"
matplotlib-base= ">=3.10"
networkx = ">=3.4.2,<4"
numpy = "*"
ophyd = ">=1.11.0"
pyepics = "*"
python = ">=3.12,<3.13"
semver = ">=3.0.4,<4"
tiled-client = ">=0.2.9"
suitcase-tiff = ">=0.4.0,<0.5"
lmfit = ">=1.3.4,<2"
librdkafka = ">=2.15.1,<2.16"
bluesky-darkframes = ">=0.6.0,<0.7"
peakutils = ">=1.3.5,<2"
suitcase-csv = ">=0.3.0,<0.4"
pytango = ">=10.0.3,<11"
suitcase-jsonl = ">=0.2.2,<0.3"
pyqt = "<6"
pyqtgraph = ">=0.13.7,<0.14"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
databroker = "==2.0.0"
bluesky-tiled-plugins = ">=2.0.2"


[feature.profile.pypi-dependencies]
epicscorelibs = "==7.0.10.99.0.1"
hasyutils = ">=2.1.0, <3"
pvxslibs = ">=1.3.2, <2"
nslsii = { git = "https://github.com/thopkins32/nslsii.git", rev = "37cab022b14cbef58c2e8f420cfe244d70f3a212" }
ophyd-async = { version = "==0.21.3", extras = ["ca"] }


[feature.qs.dependencies]
bluesky-queueserver = "*"
bluesky-httpserver = "*"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"


[feature.terminal.dependencies]
ipython = ">=9.5.0"
pyside6 = "*"
numpy = ">2"
pymca = ">=5.9.5,<6"

[feature.terminal.tasks]
start = "unset SESSION_MANAGER PYTHONPATH && MPLBACKEND=qtagg ipython --profile-dir=."
pvs = "ipython --profile-dir=. -c 'get_pv_types(); exit()'"
pymca = "pymca"

[feature.test.dependencies]
pytest = ">=8,<9"

[feature.test.tasks]
test = "pytest tests"

[environments]
terminal = {features=["profile", "terminal"], solve-group="profile"}
qs = {features=["profile", "qs"], solve-group="profile"}
test = {features=["profile", "test"], solve-group="profile"}
